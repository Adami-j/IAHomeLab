<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout('Modifier le setup', ~{::main})}">
<main>
    <section class="page-section narrow-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Setups</p>
                <h2>Modifier le setup</h2>
            </div>
            <a class="button button-secondary"
               th:href="@{/app/setups/{id}(id=${setup.id})}">Annuler</a>
        </div>

        <form class="panel form-stack"
              th:action="@{/app/setups/{id}/edit(id=${setup.id})}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label class="field">
                <span>Nom</span>
                <input class="input"
                       type="text"
                       name="name"
                       maxlength="200"
                       required
                       autofocus
                       th:value="${setup.name}">
            </label>

            <label class="field">
                <span>Description</span>
                <textarea class="input textarea"
                          name="description"
                          maxlength="500"
                          rows="5"
                          th:text="${setup.description}"></textarea>
            </label>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Enregistrer</button>
            </div>
        </form>
    </section>
</main>
</html>
