<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout('Setups', ~{::main})}">
<main>
    <section class="page-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Setups</p>
                <h2>Systèmes IA</h2>
            </div>
            <a class="button button-primary" th:href="@{/app/setups/new}">Nouveau setup</a>
        </div>

        <div class="panel empty-state" th:if="${#lists.isEmpty(setups)}">
            <div>
                <h3>Aucun setup</h3>
                <p>Créer un premier système pour commencer à versionner son architecture.</p>
            </div>
        </div>

        <div class="card-list" th:unless="${#lists.isEmpty(setups)}">
            <a class="panel setup-card"
               th:each="setup : ${setups}"
               th:href="@{/app/setups/{id}(id=${setup.id})}">
                <div>
                    <p class="eyebrow">Setup</p>
                    <h3 th:text="${setup.name}">Nom du setup</h3>
                    <p class="muted"
                       th:text="${setup.description != null ? setup.description : 'Aucune description'}">
                        Description
                    </p>
                </div>
                <span class="setup-card-action">Ouvrir →</span>
            </a>
        </div>
    </section>
</main>
</html>
