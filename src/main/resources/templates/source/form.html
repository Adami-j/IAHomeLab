<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:with="pageTitle=${editing ? 'Modifier la source' : 'Nouvelle source'}"
      th:replace="~{layouts/app :: layout(${pageTitle}, ~{::main})}">
<main>
    <section class="page-section narrow-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Research</p>
                <h2 th:text="${editing ? 'Modifier la source' : 'Nouvelle source'}">Source</h2>
            </div>
            <a class="button button-secondary" th:href="@{/app/research}">Annuler</a>
        </div>

        <form class="panel form-stack"
              th:action="${editing} ? @{/app/research/{id}/edit(id=${source.id})} : @{/app/research}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label class="field">
                <span>Titre</span>
                <input class="input"
                       type="text"
                       name="title"
                       maxlength="500"
                       required
                       autofocus
                       th:value="${editing ? source.title : ''}">
            </label>

            <div class="form-grid-2">
                <label class="field">
                    <span>Type</span>
                    <select class="input" name="type" required>
                        <option th:each="type : ${sourceTypes}"
                                th:value="${type}"
                                th:text="${type}"
                                th:selected="${editing ? source.type == type : type.name() == 'ARTICLE'}">
                            ARTICLE
                        </option>
                    </select>
                </label>

                <label class="field">
                    <span>Statut</span>
                    <select class="input" name="status">
                        <option th:each="status : ${sourceStatuses}"
                                th:value="${status}"
                                th:text="${status}"
                                th:selected="${editing ? source.status == status : status.name() == 'TO_READ'}">
                            TO_READ
                        </option>
                    </select>
                </label>
            </div>

            <label class="field">
                <span>URL</span>
                <input class="input"
                       type="url"
                       name="url"
                       maxlength="2048"
                       placeholder="https://..."
                       th:value="${editing ? source.url : ''}">
            </label>

            <label class="field">
                <span>Chemin local</span>
                <input class="input"
                       type="text"
                       name="storagePath"
                       maxlength="2048"
                       placeholder="sources/papers/..."
                       th:value="${editing ? source.storagePath : ''}">
                <small class="muted">Une URL ou un chemin local est obligatoire.</small>
            </label>

            <div class="form-grid-2">
                <label class="field">
                    <span>Nom de fichier</span>
                    <input class="input"
                           type="text"
                           name="fileName"
                           maxlength="500"
                           th:value="${editing ? source.fileName : ''}">
                </label>

                <label class="field">
                    <span>Type MIME</span>
                    <input class="input"
                           type="text"
                           name="mimeType"
                           maxlength="255"
                           placeholder="application/pdf"
                           th:value="${editing ? source.mimeType : ''}">
                </label>
            </div>

            <label class="field">
                <span>Résumé</span>
                <textarea class="input textarea"
                          name="summary"
                          rows="4"
                          th:text="${editing ? source.summary : ''}"></textarea>
            </label>

            <label class="field">
                <span>Notes</span>
                <textarea class="input textarea"
                          name="notes"
                          rows="4"
                          th:text="${editing ? source.notes : ''}"></textarea>
            </label>

            <label class="field">
                <span>Tags</span>
                <input class="input"
                       type="text"
                       name="tags"
                       placeholder="rag, llm, evaluation"
                       th:value="${editing ? tagsValue : ''}">
                <small class="muted">Sépare les tags par des virgules.</small>
            </label>

            <div class="form-actions">
                <button class="button button-primary"
                        type="submit"
                        th:text="${editing ? 'Enregistrer' : 'Créer la source'}">
                    Enregistrer
                </button>
            </div>
        </form>
    </section>
</main>
</html>
