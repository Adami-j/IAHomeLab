<!DOCTYPE html>
<html lang="fr" data-theme="lab" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — IAHomeLab</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="panel login-panel">
        <p class="eyebrow">IAHomeLab</p>
        <h1>Connexion</h1>
        <p class="muted">Utilise le compte local configuré au démarrage de l'application.</p>

        <div class="form-message form-message-error" th:if="${param.error}">
            Identifiant ou mot de passe incorrect.
        </div>

        <div class="form-message form-message-success" th:if="${param.logout}">
            Session fermée.
        </div>

        <form class="form-stack" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label class="field">
                <span>Identifiant</span>
                <input
                        class="input"
                        type="text"
                        name="username"
                        autocomplete="username"
                        autofocus
                        required>
            </label>

            <label class="field">
                <span>Mot de passe</span>
                <input
                        class="input"
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        required>
            </label>

            <button class="button button-primary" type="submit">Se connecter</button>
        </form>
    </section>
</main>
</body>
</html>
